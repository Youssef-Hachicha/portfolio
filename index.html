<!DOCTYPE html>

<body>
  <header class="bar">
    <a class="logo" href="#top" aria-label="Youssef Hachicha, top of page">yh<span>_</span></a>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="bar-end">
      <a class="cv" id="cv" href="CV_Youssef_Hachicha.pdf" download></a>

      <figure class="portrait">

      <h1 class="sr">Youssef Hachicha</h1>
      <div class="hero-ui">
        <p class="hero-role" id="heroRole"></p>
        <p class="hero-hint" id="heroHint"></p>
        <div class="cta" id="heroCta"></div>
        <p class="tcount" aria-hidden="true">t = <b id="tval">1000</b></p>

    <section class="sec" id="about"></section>
    <section class="sec" id="projects"></section>
    <section class="sec" id="skills"></section>
    <section class="sec" id="events"></section>
    <section class="sec" id="contact"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <aside class="monitor" aria-hidden="true">
    <canvas id="loss" width="240" height="110"></canvas>
    <p><span id="mEpoch"></span><span id="mLoss"></span></p>
  </aside>

  <script src="script.js"></script>
